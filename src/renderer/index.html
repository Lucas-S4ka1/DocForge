<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <title>DocForge</title>
    <!-- Strikte CSP: nur lokale Ressourcen, keine fremden Skripte/Fonts -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' docforge-asset:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: docforge-photo:; media-src 'self' blob: mediastream:; font-src 'self' data:; connect-src 'self' docforge-asset:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
