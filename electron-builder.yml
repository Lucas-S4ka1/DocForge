# Installer-Konfiguration für Windows (NSIS) und macOS (DMG/ZIP).
appId: works.pj.docforge
productName: DocForge
copyright: © P.J. Works
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
win:
  target: [nsis]
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  # Installation pro Benutzer → keine Admin-Rechte nötig (z. B. auf Schulungs-PCs)
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DocForge
  installerLanguages: [de_DE, en_US]
  language: '1031'
  # Nutzerdaten bleiben bei Deinstallation erhalten
  deleteAppDataOnUninstall: false
mac:
  target: [dmg, zip]
  icon: build/icon.png
  # Ohne Apple-Entwicklerzertifikat: ad-hoc signieren (nötig, damit die App auf Apple Silicon startet)
  identity: '-'
  hardenedRuntime: false
  category: public.app-category.productivity
  artifactName: ${productName}-${version}-${arch}.${ext}
  extendInfo:
    NSCameraUsageDescription: DocForge benötigt die Kamera für Bewerbungsfotos im Kamera-Studio. Bilder werden nur lokal verarbeitet.
linux:
  target: [AppImage]
compression: maximum
# Releases & Auto-Update über GitHub Releases (öffentliches Repo)
publish:
  provider: github
  owner: Lucas-S4ka1
  repo: DocForge
  releaseType: release
